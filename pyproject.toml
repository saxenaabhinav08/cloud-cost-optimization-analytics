[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-cost-optimization-analytics"
version = "0.1.0"
description = "A beginner-friendly analysis of fictional AWS billing data with optional MySQL storage."
requires-python = ">=3.10"
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "PyMySQL>=1.1,<2.0",
    "python-dotenv>=1.0,<2.0",
    "pandas>=2.0,<4.0",
    "streamlit>=1.66,<2.0",
    "streamlit-echarts==0.4.0",
    "sqlglot>=26,<31",
    "plotly>=5.20,<7.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.34,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
